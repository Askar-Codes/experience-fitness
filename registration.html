<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create an account at Experience Fitness.">
    <meta name="author" content="Balakhazy Askar">
    <title>Experience Fitness — Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/askar.css">
</head>
<body>

<!-- Page author: Balakhazy Askar -->

<header>
    <img class="logo-mark" src="images/logo-EF.webp" alt="Experience Fitness logo">
    <h1>Experience Fitness</h1>

    <input type="checkbox" id="navToggle" class="visually-hidden" aria-label="Toggle navigation" aria-controls="navMenu">
    <label for="navToggle" class="nav-toggler" aria-hidden="true">&#9776;</label>

    <nav>
        <ul id="navMenu">
            <li><a class="active" href="index.html">Home</a></li>
            <li><a href="trainers.html">Trainers</a></li> <!-- ВОТ ЭТА СТРОКА -->
            <li><a href="registration.html">Registration</a></li>
            <li><a href="booking.html">Book a Trial Session</a></li>
            <li><a href="subscribe.html">Buy a Membership</a></li>
        </ul>
    </nav>
</header>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="registration-card">
                <span class="registration-note">Takes less than a minute.</span>
                <h2>Registration</h2>

                <!--
                    js- prefix: everything JavaScript will need to find later.
                    Search "js-registration" to see every hook this page prepares.
                -->
                <form id="js-registration-form" method="post" action="#">
                    <!-- there is no server yet -->
                    <fieldset>
                        <legend class="visually-hidden">Account Details</legend>

                        <div class="form-row">
                            <label for="js-registration-account">Account name</label>
                            <input type="text" id="js-registration-account" name="account" placeholder="Username" required>
                        </div>

                        <div class="form-row">
                            <label for="js-registration-name">Name</label>
                            <input type="text" id="js-registration-name" name="name" placeholder="Your name" required>
                        </div>

                        <div class="form-row">
                            <label for="js-registration-phone">Telephone</label>
                            <input type="tel" id="js-registration-phone" name="phone" placeholder="+7" required>
                        </div>

                        <div class="form-row">
                            <label for="js-registration-email">Email</label>
                            <input type="email" id="js-registration-email" name="email" placeholder="ExperienceFitness@gmail.com" required>
                        </div>

                        <p class="form-helper">We'll create your account and show a confirmation right below.</p>

                        <button type="submit" id="js-registration-submit-btn" class="btn btn-outline">Register</button>
                        <button type="reset" id="js-registration-reset-btn" class="btn btn-outline btn-sm">Clear</button>
                    </fieldset>
                </form>

                <!--
                    Empty on purpose: JavaScript will fill this with a confirmation
                    or an error message and toggle the hidden/success/error classes.
                    aria-live="polite" so screen readers announce it once JS fills it.
                -->
                <div id="js-registration-confirmation" class="confirmation-box hidden" role="status" aria-live="polite"></div>
            </div>
        </div>
    </div>
</main>

<footer class="site-footer">
    <img class="logo-mark" src="images/logo-EF.webp" alt="Experience Fitness logo">
    <p class="copyright">&copy; 2026 Experience Fitness</p>
</footer>

</body>
</html>
