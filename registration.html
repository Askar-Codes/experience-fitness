<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create an account at Experience Fitness.">
    <meta name="author" content="Balakhazy Askar">
    <title>Experience Fitness — Registration</title>
    <!-- Bootstrap 5.3.3, loaded from jsDelivr CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/askar.css">
</head>
<body>

<!-- Page author: Balakhazy Askar -->

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="images/logo-EF.webp" alt="Experience Fitness logo" height="32">
                Experience Fitness
            </a>
            <!--
                Burger menu : the hidden checkbox remembers open/closed,
                the label is the burger button, and base.css opens the menu on :checked
                with a transition.
            -->
            <input type="checkbox" id="navToggle" class="visually-hidden" aria-label="Toggle navigation" aria-controls="navMenu">
            <label for="navToggle" class="navbar-toggler">
                <span class="navbar-toggler-icon"></span>
            </label>
            <div class="navbar-collapse nav-menu" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="registration.html">Registration</a></li>
                    <li class="nav-item"><a class="nav-link" href="booking.html">Book a Trial Session</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <p class="text-muted small mb-3">Takes less than a minute.</p>
                    <h2 class="h4 mb-3">Registration</h2>

                    <form method="post" action="#">
                        <!-- there is no server yet -->
                        <fieldset>
                            <legend class="visually-hidden">Account Details</legend>

                            <div class="mb-3">
                                <label for="account" class="form-label">Account name</label>
                                <input type="text" id="account" name="account" class="form-control" placeholder="Username" required>
                            </div>

                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" id="name" name="name" class="form-control" placeholder="Your name" required>
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="form-label">Telephone</label>
                                <input type="tel" id="phone" name="phone" class="form-control" placeholder="+7" required>
                            </div>

                            <div class="mb-4">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" id="email" name="email" class="form-control" placeholder="ExperienceFitness@gmail.com" required>
                            </div>

                            <button type="submit" class="btn btn-outline-success">Register</button>
                            <button type="reset" class="btn btn-outline-secondary btn-sm">Clear</button>
                        </fieldset>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="bg-dark text-center py-4">
    <img src="images/logo-EF.webp" alt="Experience Fitness logo" class="logo-mark d-block mx-auto mb-2" height="28">
    <p class="text-white-50 small mb-0">&copy; 2026 Experience Fitness</p>
</footer>

</body>
</html>
